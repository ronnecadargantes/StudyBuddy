
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build
          ls -la dist || ls -la build || true

      - name: Add and sync Capacitor Android
        env:
          CI: "true"
          CAPACITOR_TELEMETRY_ENABLED: "false"
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps --no-audit --no-fund
          rm -f capacitor.config.json
          npx cap init "StudyBuddy" "com.ronnecadargantes.studybuddy" --web-dir=dist --non-interactive || true
          npx cap add android
          npx cap sync android

      - name: Assemble Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
